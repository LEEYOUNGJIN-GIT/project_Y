# 모든 값은 시작값이다. 청취 평가 전에는 기본값으로 굳히지 않는다 (5.6).
yoga_flow_calm:
  tts:
    voice_candidates: 3          # 공급자 음색 목록 확인 필요 [재확인]
    speed: 0.95
    cue_speed: 1.00              # MVP 미구현: 항목별 cue 구분이 없다 (docs/open_questions.md)
    pause_between_sentences_ms: 450
    max_cue_words: 6
    emphasis: pause_only         # MVP 미구현: 경고만 낸다
    moods:                       # 무드는 속도 배율로만 표현한다 (5.1-6). 배율 값은 이 도구의 임의 시작값
      calm: 1.00
      warm: 0.98
      uplifting: 1.03
  narration_eq:
    high_pass_hz: 80
    compression_ratio: 2.0
  bgm:
    character: [ambient, warm_pad, soft_pluck]
    level_vs_narration_db: -14   # BGM 통합음량 - 내레이션 통합음량 (LU)
    duck_db: 6.0
    duck_attack_ms: 80
    duck_release_ms: 600
    midrange_1_4khz_cut_db: -3
    fade_in_s: 1.0
    fade_out_s: 2.0
  original_audio: duck
  duck_under_narration_db: -15
  loudness_lufs: -14.0

breath_minimal:
  tts:
    speed: 0.93
    pause_between_sentences_ms: 600
    max_cue_words: 4
    moods: {calm: 1.00}
  narration_eq:
    high_pass_hz: 80
    compression_ratio: 2.0
  bgm:
    level_vs_narration_db: -20
    duck_db: 8.0
    duck_attack_ms: 80
    duck_release_ms: 600
    midrange_1_4khz_cut_db: 0
    fade_in_s: 1.0
    fade_out_s: 2.0
  original_audio: keep
  duck_under_narration_db: -15
  loudness_lufs: -14.0
