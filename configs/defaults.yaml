# 도구 경로. null이면 환경변수 AVSYNC_FFMPEG / AVSYNC_FFPROBE를 본다.
# Windows 기본 권장: 절대 경로를 적고 allow_path_fallback을 false로 둔다 (PATH 의존 금지, 문서 3.3).
tools:
  ffmpeg: null
  ffprobe: null
  allow_path_fallback: true   # 개발 환경 편의. doctor가 PATH 사용 시 경고한다.

# 모델 캐시. null이면 Windows는 %LOCALAPPDATA%\avsync\models, 그 외는 ~/.cache/avsync/models
model_cache: null

audio:
  sample_rate: 48000
  channels: 2

tts:
  default_provider: kokoro        # 벤치마크 통과 전까지는 "후보"이며 확정값이 아니다 (3.4)
  words_per_second: [2.0, 2.4]    # 글자 수 예산 추정값. 첫 벤치마크 결과로 교체한다 (4.3)

providers:
  kokoro:
    kind: subprocess
    env_dir: provider_envs/kokoro
    default_voice: null            # 청취 후 사용자가 선택. null이면 합성 요청이 거부된다
    lang: en-US
  gemini:                          # 5.7. 공식 gemini-api CLI를 감싼다. 키는 CLI/환경변수가 관리하며 이 도구는 읽지 않는다
    kind: cli
    cli_path: null                 # null이면 환경변수 AVSYNC_GEMINI_CLI, 그다음 PATH의 gemini-api
    default_voice: null            # `gemini-api tts --help`로 확인한 음성을 청취 후 지정
    model: null                    # null이면 CLI 기본 모델
    style_prefix: ""               # 예: "Say calmly and slowly: " (모델이 소리 내어 읽는지는 청취로 확인해야 함)
    free_only: true                # confirm-free 확인 없이는 호출 거부
    max_retries: 2
    timeout_s: 120
  flite:
    kind: builtin
    note: "FFmpeg libflite. 파이프라인 시험 전용. 품질 평가·실제 제작에 쓰지 않는다"

# burn-in 자막. 폰트는 시스템 폰트를 임의로 쓰지 않고 파일과 라이선스를 지정한다 (8장).
# project.yaml의 output.caption_style로 덮어쓴다. margin_v(아래 여백, px)는 플랫폼 UI 안전 영역 미확인이라 시작값.
captions:
  font_size: 64
  margin_v: 420
  margin_h: 90
