name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync
      - run: uv run avsync doctor
        continue-on-error: true      # PATH 폴백 경고 등은 실패로 보지 않는다. 결과는 로그로 확인
      - run: uv run pytest -q

  # Kokoro를 실제로 설치·실행해 보는 점검. 개발 환경에서는 모델 호스트가 막혀 있어 여기서만 검증할 수 있다.
  # 러너 성능은 사용자 PC와 다르므로 RTF/메모리는 참고용이다 (판단 근거 아님).
  kokoro-smoke:
    name: kokoro-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/dreamy-ride-etkw8p'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install FFmpeg (Windows)
        run: choco install ffmpeg -y --no-progress
      - run: uv sync
      - name: Kokoro 환경 설치 (Python 3.12)
        working-directory: provider_envs/kokoro
        run: uv sync --python 3.12
      - name: 벤치마크 + 샘플 가이드 합성
        run: uv run python scripts/ci_kokoro_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro-smoke-${{ matrix.os }}
          path: ci_artifacts/
          if-no-files-found: warn
